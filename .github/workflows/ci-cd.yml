name: CI/CD

# master -> production. Pull requests only build the image.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/binaryhubrw/tourista-rwanda-fe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          case "$GITHUB_REF" in
            refs/heads/master) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.target.outputs.environment != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.target.outputs.environment != '' }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.environment || 'ci' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: needs.build.outputs.environment != ''
    runs-on: [self-hosted, "${{ vars.DEPLOY_RUNNER_LABEL || 'testing' }}"]
    environment: ${{ needs.build.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.build.outputs.environment }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      # Self-hosted runners often have a GPG-backed docker credential helper that breaks
      # `docker login`; use an isolated config with inline auth instead.
      - name: Configure GHCR auth
        env:
          GHCR_USER: ${{ vars.GHCR_USER || github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          test -n "$GHCR_PAT" || { echo "::error::GHCR_PAT secret is not set"; exit 1; }
          CFG="$RUNNER_TEMP/docker-config"
          mkdir -p "$CFG"
          AUTH="$(printf '%s:%s' "$GHCR_USER" "$GHCR_PAT" | base64 | tr -d '\n')"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH" > "$CFG/config.json"
          echo "DOCKER_CONFIG=$CFG" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/tourista/tourista-fe-$ENVIRONMENT}"
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"
          export IMAGE_TAG="sha-$GITHUB_SHA"
          docker compose pull web
          docker compose up -d --remove-orphans
          docker image prune -f
